<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sawa Rooms – List your space</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300..700&family=Playfair+Display:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="script.js" defer></script>
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo"><i class="fas fa-home"></i> SAWA <span>ROOMS</span></a>
        <div class="nav-links">
            <a href="stays.html">Stays</a>
            <a href="host.html">Become a host</a>
            <a href="help.html">Help</a>
            <a href="signin.html" class="btn-small">Sign in</a>
        </div>
    </div>
</nav>
<main class="container" style="max-width: 700px; margin: 3rem auto;">
    <div class="signin-card">
        <h1><i class="fas fa-home"></i> List your room on Sawa Rooms</h1>
        <p>Earn extra income – it's free to list. Fill in the details below. (Prices in UGX)</p>
        <form id="hostForm">
            <div class="form-group"><input type="text" id="roomName" placeholder="Room name (e.g., Cozy studio in Kololo)" required></div>
            <div class="form-group">
                <select id="roomDistrict" required>
                    <option value="">Select district</option>
                    <option>Kampala</option><option>Jinja</option><option>Mbarara</option><option>Entebbe</option>
                    <option>Gulu</option><option>Fort Portal</option><option>Arua</option><option>Mbale</option>
                    <option>Lira</option><option>Kabale</option>
                </select>
            </div>
            <div class="form-group"><input type="number" id="roomPrice" placeholder="Price per night (UGX)" required></div>
            <div class="form-group"><input type="number" step="0.1" id="roomRating" placeholder="Rating (0–5)" value="4.0" required></div>
            <div class="form-group"><input type="text" id="roomImage" placeholder="Image URL (Unsplash recommended)" value="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=400&h=300&fit=crop"></div>
            <div class="form-group">
                <select id="roomType" required>
                    <option value="Entire place">Entire place</option>
                    <option value="Private room">Private room</option>
                    <option value="Shared dorm">Shared dorm</option>
                </select>
            </div>
            <div class="form-group"><label>Amenities (check all that apply)</label><div id="amenitiesCheckboxes" class="amenities-list"></div></div>
            <button type="submit" class="btn">List your room</button>
        </form>
        <p id="hostMessage" style="margin-top: 1rem;"></p>
        <div class="local-impact" style="margin-top: 1.5rem; padding: 1rem;">
            <i class="fas fa-hand-holding-heart"></i> <strong>Local impact:</strong> 0% commission – 100% goes to you.
        </div>
    </div>
</main>
<footer><p>© 2026 Sawa Rooms – zero commission, real travelers</p></footer>
<script>
    const amenitiesList = ['wifi','heater','parking','breakfast','ac','tv'];
    const container = document.getElementById('amenitiesCheckboxes');
    amenitiesList.forEach(a => { container.innerHTML += `<label><input type="checkbox" value="${a}"> ${a}</label><br>`; });
    document.getElementById('hostForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('roomName').value;
        const district = document.getElementById('roomDistrict').value;
        let priceUgx = parseInt(document.getElementById('roomPrice').value);
        if (isNaN(priceUgx)) priceUgx = 50000;
        // convert UGX to USD for storage (approx)
        const usdPrice = Math.round(priceUgx / 3700);
        const rating = parseFloat(document.getElementById('roomRating').value);
        let image = document.getElementById('roomImage').value;
        const type = document.getElementById('roomType').value;
        const selectedAmenities = [...document.querySelectorAll('#amenitiesCheckboxes input:checked')].map(cb => cb.value);
        let rooms = JSON.parse(localStorage.getItem('sawaRooms')) || window.allRooms;
        const newId = rooms.length + 1;
        const priceUgxFormatted = priceUgx.toLocaleString('en-UG');
        const newRoom = { id: newId, name, district, price: usdPrice, priceUgx: priceUgxFormatted, rating, reviews: 0, host: "New Host", image, amenities: selectedAmenities, distance: "1.0km", type };
        rooms.push(newRoom);
        localStorage.setItem('sawaRooms', JSON.stringify(rooms));
        window.allRooms = rooms;
        document.getElementById('hostMessage').innerHTML = '✅ Room added! <a href="stays.html">Browse stays</a>';
        document.getElementById('hostForm').reset();
    });
</script>
</body>
</html>
